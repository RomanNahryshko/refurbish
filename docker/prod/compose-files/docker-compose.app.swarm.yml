######################################### Networks and global extensions
#x-project-volumes: &project-volumes
#    - /data/fileserver/${PROJECT_NAME_PREFIX}/frontend-logs:/var/log/nginx
x-replicated: &replicated-service
  # command: ["node", "npm", "run", "start"]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "4"
  deploy:
    replicas: ${REPLICAS_COUNT}
    mode: replicated
    endpoint_mode: dnsrr
    update_config:
      parallelism: 1
      delay: 7s
      order: start-first
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 3
      window: 120s
networks:
  default:
    external:
      name: ${NETWORK_NAME}
##############################################################################
#                           SERVICES                                         #
##############################################################################
services:
######################################### Required Services
  app:
    image: ${HUB_REPOSITORY_DOMAIN}${COMPOSE_PROJECT_NAME}-app:${BUILD_NUMBER:-latest}
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-3000}
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: shtalinberg@attractgroup.com
      TASK_SLOT: "{{.Task.Slot}}"
      NODE_ENV: production
      PORT: ${VIRTUAL_PORT:-3000}
      HOST: "0.0.0.0"
      # Supabase environment variables
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_PROXY_URL: ${NEXT_PUBLIC_SUPABASE_PROXY_URL}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "4"
    deploy:
      replicas: ${REPLICAS_COUNT}
      mode: replicated
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        delay: 7s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s