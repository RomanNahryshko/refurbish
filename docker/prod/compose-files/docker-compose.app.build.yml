version: "3.8"
##############################################################################
#                           SERVICES                                         #
##############################################################################

services:
######################################### Required Services

  app:
    build:
      context: ../../..
      dockerfile: ./docker/${DOCKER_ENV_TYPE}/nodejs/Dockerfile
      args:
        # Build arguments for NEXT_PUBLIC_* variables (required at build time)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        NEXT_PUBLIC_SUPABASE_PROXY_URL: ${NEXT_PUBLIC_SUPABASE_PROXY_URL}
    image: ${HUB_REPOSITORY_DOMAIN}${COMPOSE_PROJECT_NAME}-app:${BUILD_NUMBER:-latest}